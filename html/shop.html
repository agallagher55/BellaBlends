<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | Bella's Blend</title>
  <link rel="stylesheet" href="../static/styles/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="logo" href="/">Bella's<span>Blend</span></a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/shop" class="active">Shop</a>
        <a href="/products">Products</a>
        <a href="/markets">Markets</a>
        <a href="/about">About</a>
        <a
          class="nav-icon-link"
          href="https://www.instagram.com/bellasblend/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Bella's Blend on Instagram"
        >
          <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <section class="section">
    <h2 class="section-title">All Treats</h2>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="product-grid" class="product-grid">
      <p class="empty-state">Loading treats&hellip;</p>
    </div>
  </section>

  <footer class="site-footer">
    &copy; 2026 Bella's Blend. Made with love for good dogs everywhere.
  </footer>

  <script src="../static/js/nav.js"></script>

  <script src="../static/js/shop.js"></script>
</body>
</html>
